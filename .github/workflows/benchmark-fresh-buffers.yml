name: Fresh-buffer performance benchmark

on:
  workflow_dispatch:
    inputs:
      trials:
        description: PostgreSQL restart trials (2–10; default 5)
        required: false
        default: '5'
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose build db
      - name: Run deterministic 10,000-memory benchmark
        env:
          FRESH_BUFFER_TRIALS: ${{ inputs.trials || '5' }}
          MACHINE_LABEL: github-${{ runner.os }}-${{ runner.arch }}
        run: npm run db:benchmark:fresh-buffers -- --large
      - name: Upload plans and report
        uses: actions/upload-artifact@v4
        with:
          name: fresh-buffer-10000-${{ github.run_id }}
          path: |
            docs/evaluation/fresh-buffer-trials/fresh-buffer-pools.json
            docs/evaluation/fresh-buffer-trials/RESULTS.md
          if-no-files-found: error
          retention-days: 90
